<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   
    <title>AR Scanner</title>
     <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
      <script src="https://raw.githack.com/AR-js-org/AR.js/dev/aframe/build/aframe-ar.js"></script>
      
  </head>
  <body style="margin : 0px; overflow: hidden;">
  
    <script type="module" src="/src/main.js"></script>

   
        <a-scene  vr-mode-ui="enabled: false;"  renderer="logarithmicDepthBuffer: true; antialias: true; shadowMapEnabled: true; shadowMapType: pcfsoft; toneMapping: ACESFilmic; toneMappingExposure: 1.2" embedded
      arjs="trackingMethod: best; sourceType: webcam;debugUIEnabled: false;" >
          <a-assets>
    <a-asset-item id="schnitzel" src="./blender_models/pizza.gltf"></a-asset-item>
  </a-assets>
        <a-marker preset="hiro">
            <a-entity
            position="0 0 0"
            rotation="0 0 0"
            scale="0.05 0.05 0.05"
            gltf-model="#schnitzel"
            castShadow="true"
            
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"
            ></a-entity>
                  
            
        </a-marker>
        <a-light type="directional"
         position="1 2 1"
         intensity="3"
         color="#ffffff"
        
       ></a-light>

    
      
        <a-entity camera></a-entity>
        </a-scene>
  
  </body>
</html>
