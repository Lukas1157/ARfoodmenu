<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Scanner</title>

    <script crossorigin="anonymous" src="./aframe-image-targets-example-main/external/scripts/8frame-1.5.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script type="module">
  import { supabase } from './supabase.js';

  // Warten, bis das HTML vollständig geladen ist, bevor wir auf Elemente zugreifen.
  window.addEventListener('DOMContentLoaded', async () => {
    // Daten aus der Supabase-Tabelle 'Gerichte' laden und nach ID sortieren.
    const { data: Gerichte, error } = await supabase
      .from('Gerichte')
      .select('*')
      .order('id', { ascending: true });

    if (error) {
      console.error('Supabase error:', error);
      return;
    }

    // Gerichte nach Kategorien in eigene Listen aufteilen.
    const categories = {
      vorspeisen: Gerichte?.filter(gericht => gericht.Art_der_Speise === 'Vorspeise'),
      hauptspeisen: Gerichte?.filter(gericht => gericht.Art_der_Speise === 'Hauptspeise'),
      getränke: Gerichte?.filter(gericht => gericht.Art_der_Speise === 'Getränk'),
      desserts: Gerichte?.filter(gericht => gericht.Art_der_Speise === 'Dessert'),
    };

    // Referenzen auf die UI-Elemente speichern, die wir später aktualisieren.
    const entity = document.querySelector('[gltf-model]');
    const foodnameEl = document.getElementById('foodname');
    const descriptionEl = document.getElementById('description');
    const priceEl = document.getElementById('price');
    const allergyinfoEl = document.getElementById('allergyinfo');
    const thumbnail1El = document.getElementById('thumbnail1');
    const thumbnail2El = document.getElementById('thumbnail2');
    const thumbnail3El = document.getElementById('thumbnail3');
    const buttonLeft = document.getElementById('buttonleft');
    const buttonRight = document.getElementById('buttonright');

    // Aktuelle Kategorie und Positionen für die Vorschau speichern.
    let currentCategoryKey = 'vorspeisen';
    let currentStartIndex = 0;
    let selectedIndex = 0;

    // Zeigt ein ausgewähltes Gericht im AR-Modell und in den Textfeldern an.
    function updateDish(gericht) {
      if (!gericht) return;

      if (entity) {
        entity.setAttribute('gltf-model', gericht.GTLF_url || '');
      }

      foodnameEl.textContent = gericht.Name || 'Unbekanntes Gericht';
      descriptionEl.textContent = gericht.Beschreibung || 'Keine Beschreibung verfügbar.';
      priceEl.textContent = (gericht.Preis != null ? `${gericht.Preis}€` : 'Preis nicht verfügbar');
      allergyinfoEl.textContent = gericht.Hinweise || 'Keine Allergieinformationen.';
    }

    // Aktualisiert die drei Vorschaubilder unterhalb des AR-Inhalts.
    function updateThumbnails(list, startIndex) {
      [thumbnail1El, thumbnail2El, thumbnail3El].forEach((thumbEl, offset) => {
        const item = list[startIndex + offset];
        thumbEl.src = item?.Thumbnail_url || '';
        const itemIndex = startIndex + offset;
        thumbEl.classList.toggle('active-thumbnail', itemIndex === selectedIndex);
      });
    }

    // Steuert die Sichtbarkeit und Interaktion der Pfeil-Buttons.
    function updateNavigation(list) {
      if (!buttonLeft || !buttonRight) return;

      const maxStartIndex = Math.max(0, list.length - 3);
      buttonLeft.style.opacity = currentStartIndex <= 0 ? '0.35' : '1';
      buttonRight.style.opacity = currentStartIndex >= maxStartIndex ? '0.35' : '1';
      buttonLeft.style.pointerEvents = currentStartIndex <= 0 ? 'none' : 'auto';
      buttonRight.style.pointerEvents = currentStartIndex >= maxStartIndex ? 'none' : 'auto';
    }

    function setActiveMenuItem(categoryKey) {
      document.querySelectorAll('.menubaricon').forEach(item => {
        item.classList.toggle('active', item.id === categoryKey);
      });
    }

    // Zeigt eine komplette Kategorie und ihre erste Vorschau an.
    function showCategory(categoryKey) {
      currentCategoryKey = categoryKey;
      currentStartIndex = 0;
      selectedIndex = 0;
      const list = categories[categoryKey];
      if (!list || list.length === 0) {
        console.warn(`Keine Gerichte für Kategorie ${categoryKey} gefunden.`);
        return;
      }

      setActiveMenuItem(categoryKey);
      updateDish(list[selectedIndex]);
      updateThumbnails(list, currentStartIndex);
      updateNavigation(list);
    }

    // Verschiebt die angezeigten Thumbnails nach links oder rechts.
    function moveThumbnails(direction) {
      const list = categories[currentCategoryKey];
      if (!list || list.length === 0) return;

      const maxStartIndex = Math.max(0, list.length - 3);
      const nextIndex = currentStartIndex + direction;
      if (nextIndex < 0 || nextIndex > maxStartIndex) return;

      currentStartIndex = nextIndex;
      updateThumbnails(list, currentStartIndex);
      updateNavigation(list);
    }

    // Wählt eines der drei aktuell sichtbaren Thumbnails aus und zeigt es an.
    function selectThumbnail(offset) {
      const list = categories[currentCategoryKey];
      if (!list || list.length === 0) return;

      const index = currentStartIndex + offset;
      if (index < 0 || index >= list.length) return;

      selectedIndex = index;
      updateDish(list[selectedIndex]);
      updateThumbnails(list, currentStartIndex);
    }

    // Event-Listener für die Kategorie-Buttons.
    document.getElementById('vorspeisen')?.addEventListener('click', () => showCategory('vorspeisen'));
    document.getElementById('hauptspeisen')?.addEventListener('click', () => showCategory('hauptspeisen'));
    document.getElementById('getränke')?.addEventListener('click', () => showCategory('getränke'));
    document.getElementById('desserts')?.addEventListener('click', () => showCategory('desserts'));

    // Event-Listener für die Navigation der Thumbnails.
    buttonLeft?.addEventListener('click', () => moveThumbnails(-1));
    buttonRight?.addEventListener('click', () => moveThumbnails(1));
    thumbnail1El?.addEventListener('click', () => selectThumbnail(0));
    thumbnail2El?.addEventListener('click', () => selectThumbnail(1));
    thumbnail3El?.addEventListener('click', () => selectThumbnail(2));

    // Beim Laden der Seite direkt die erste Kategorie und ihr erstes Gericht anzeigen.
    showCategory('vorspeisen');
  });
</script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
     <!-- <script type="module" src="./src/main.js"></script> -->
    <script src="bundle.js"></script>
<div id="UI">

<div id="info">
      <div class="topinfo">
<p id="foodname">Food Name</p>
      <p id="price">Price</p>
      </div>
      
      <p id="description">Description</p>
      
      <p id="allergyinfo">Allergy Information</p>
      </div>
      <div id="whitebar"></div>

      
      <div id="selectionscroll">
        <div id="buttonleft">
          <img src="icons/buttonleft.svg">
        </div>
<div id ="images">
<img id="thumbnail1" class="thumbnail" src="">
<img id="thumbnail2" class="thumbnail"  src="">
<img id="thumbnail3" class="thumbnail"  src="">
      </div>
      <div id="buttonright">
        <img src="icons/buttonright.svg">
      </div>
      </div>


      <div id ="menubar">
        <div class="menubaricon" id="vorspeisen">
          <img src="icons/vorspeisen.svg">
          <p>Vorspeisen</p>
        </div>
        <div class="menubaricon" id="hauptspeisen">
          <img src="icons/hauptspeisen.svg">
<p>Hauptspeisen</p>
        </div>
        <div class="menubaricon" id="getränke">
          <img src="icons/getränke.svg">
<p>Getränke</p>
        </div>
        <div class="menubaricon" id="desserts">
          <img src="icons/desserts.svg">
<p>Desserts</p>
        </div>

      </div>

    </div>




    <a-scene
      landing-page
      xrextras-loading
      xrextras-runtime-error
      renderer="colorManagement: true"
      xrweb="disableWorldTracking: true">

      <a-camera position="0 4 10"></a-camera>

      <a-light type="directional" intensity="3" position="1 2 1" color="#ffffff"></a-light>
      <a-light type="ambient" intensity="1"></a-light>

      <!-- "name" must match your image target name in the 8th Wall project dashboard -->
      <xrextras-named-image-target name="pizzatracker">
        <a-entity
          gltf-model=""
          scale="1 1 1"
          position="0 0 0"
          rotation="90 0 0"
          >
        </a-entity>
      </xrextras-named-image-target>

    </a-scene>
    
    
  </body>
</html>
